name: Daily Auto Commit

on:
  schedule:
    - cron: "37 3 * * *" # runs daily at ~9:07 AM IST (03:37 UTC)
    - cron: "37 11 * * *" # runs daily at ~5:07 PM IST (11:37 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}
          GIT_NAME: ${{ secrets.GIT_NAME || github.actor }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: Make 150 commits
        run: |
          for i in {1..150}; do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - commit $i" >> activity.log
            git add activity.log
            git commit -m "Auto commit $i: $(date -u '+%Y-%m-%d %H:%M UTC')"
          done

      - name: Push all commits
        run: git push origin HEAD:main
