name: Daily Auto Commit

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check daily schedule window
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_hour=$(TZ=Asia/Kolkata date +%H)
          current_minute=$(TZ=Asia/Kolkata date +%M)
          if [ "$current_hour" = "10" ] && [ "$current_minute" = "47" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}
          GIT_NAME: ${{ secrets.GIT_NAME || github.actor }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: Make 39 commits
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          for i in {1..39}; do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - commit $i" >> activity.log
            git add activity.log
            git commit -m "Auto commit $i: $(date -u '+%Y-%m-%d')"
          done

      - name: Push changes
        if: steps.schedule_gate.outputs.run == 'true'
        run: git push origin HEAD:main
