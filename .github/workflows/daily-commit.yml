name: Daily Auto Commit

on:
  push:
    paths:
      - ".github/workflows/daily-commit.yml"
  schedule:
    - cron: "07 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}
          GIT_NAME: ${{ secrets.GIT_NAME || github.actor }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: Make 60 commits
        run: |
          for i in {1..60}; do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - commit $i" >> activity.log
            git add activity.log
            git commit -m "Auto commit $i: $(date -u '+%Y-%m-%d')"
          done

      - name: Push changes
        run: git push origin HEAD:${{ github.ref_name }}
