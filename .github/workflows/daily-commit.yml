name: Daily Auto Commit

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_NAME: ${{ secrets.GIT_NAME }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: Make 10 commits
        run: |
          for i in {1..10}; do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - commit $i" >> activity.log
            git add activity.log
            git commit -m "Auto commit $i: $(date -u '+%Y-%m-%d')"
          done

      - name: Push changes
        run: git push
